# Opt-in, disposable JournalEntry append E2E stack. It intentionally exposes
# no host ports and uses its own project-scoped named volumes. Run only through
# scripts/run-journal-e2e.sh, which checks Docker memory and that the normal
# stack is stopped before it starts this file.
services:
  journal-e2e-neo4j:
    image: neo4j:2026.05-enterprise
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: "neo4j/journal-e2e-password"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      NEO4J_server_memory_heap_initial__size: "512M"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512M"
    volumes:
      - journal-e2e-neo4j-data:/data
      - journal-e2e-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p journal-e2e-password 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  journal-e2e-ollama:
    image: ollama/ollama:latest
    volumes:
      - journal-e2e-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Model provisioning is deliberately a one-shot service so mcp-cypher only
  # starts after a real bge-m3 model is present in this isolated volume.
  journal-e2e-ollama-model:
    image: ollama/ollama:latest
    depends_on:
      journal-e2e-ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://journal-e2e-ollama:11434"
    volumes:
      - journal-e2e-ollama-data:/root/.ollama
    # Keep the image's `ollama` entrypoint; the prior shell form made `-c`
    # execute only the word "ollama" and could falsely report success without
    # pulling the model.
    command: ["pull", "bge-m3"]
    restart: "no"

  journal-e2e-mcp-cypher:
    build:
      context: ./mcp_servers/cypher
    depends_on:
      journal-e2e-neo4j:
        condition: service_healthy
      journal-e2e-ollama:
        condition: service_healthy
      journal-e2e-ollama-model:
        condition: service_completed_successfully
    environment:
      NEO4J_URI: "bolt://journal-e2e-neo4j:7687"
      NEO4J_USERNAME: "neo4j"
      NEO4J_PASSWORD: "journal-e2e-password"
      NEO4J_DATABASE: "neo4j"
      NEO4J_TRANSPORT: "streamable-http"
      NEO4J_MCP_SERVER_HOST: "0.0.0.0"
      NEO4J_MCP_SERVER_PORT: "8000"
      NEO4J_MCP_SERVER_PATH: "/api/mcp/"
      EMBEDDING_PROVIDER: "ollama"
      EMBEDDING_MODEL: "bge-m3"
      EMBEDDING_DIMENSIONS: "1024"
      OLLAMA_EMBEDDING_TIMEOUT_SECONDS: "20"
      OLLAMA_BASE_URL: "http://journal-e2e-ollama:11434"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=25).getcode() == 200 else 1)"]
      interval: 15s
      timeout: 30s
      retries: 4
      start_period: 15s

  journal-e2e:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
    depends_on:
      journal-e2e-mcp-cypher:
        condition: service_healthy
    environment:
      DIGITAL_BRAIN_MCP_URL: "http://journal-e2e-mcp-cypher:8000/api/mcp/"
      MCP_REQUEST_TIMEOUT_SECONDS: "30"
    command:
      - /bin/sh
      - -ec
      - |
        python scripts/bootstrap_journal_chain.py --empty --apply
        python tests/e2e/journal_append_smoke.py

volumes:
  journal-e2e-neo4j-data:
  journal-e2e-neo4j-logs:
  journal-e2e-ollama-data:
