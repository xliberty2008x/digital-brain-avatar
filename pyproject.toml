[project]
name = "avatar-digital-brain"
version = "0.1.0"
description = "Local Neo4j graph memory, Cypher MCP, and digital-brain-buddy host plugin for a personal digital brain."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Match mcp_servers/cypher runtime pins so importorskip-gated server suites collect.
    "fastmcp>=2.10.0",
    "neo4j>=5.26.0",
    # Needed to import digital_brain.callbacks under the hermetic interpreter.
    "structlog>=24.0",
    "google-adk>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Collect named dream E2E modules so unit CI always runs the release gates.
python_files = ["test_*.py", "*_test.py", "dream_workflow_smoke.py", "dream_crash_recovery.py"]
