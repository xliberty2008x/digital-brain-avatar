services:
  neo4j:
    # Enterprise 2026.x matches Aura restore / local volumes written with kernel
    # version 29. Community 5.26 cannot open those store files (no downgrade).
    image: neo4j:2026.05-enterprise
    # Bind to loopback only — MCP/Neo4j have no application auth.
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      # Keep the local graph within a predictable budget so Ollama has enough
      # Docker Desktop memory for real bge-m3 embedding requests.
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL_SIZE:-512M}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX_SIZE:-1G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE_SIZE:-512M}"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD:-password} 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mcp-cypher:
    build:
      context: ./mcp_servers/cypher
      args:
        EMBEDDING_EXTRAS: "${EMBEDDING_EXTRAS:-}"
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MCP_CYPHER_PORT:-8000}:8000"
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      # Fallback life-graph auth (first boot / pre-role stacks only).
      # Dual-layer security requires NEO4J_RUNTIME_* after:
      #   DIGITAL_BRAIN_APPLY_QUALITY_ROLES=1 → scripts/init_quality_roles.py --apply
      # See .env.example. server.py prefers runtime/quality when set.
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-password}"
      # Model-facing runtime role (usernames default; passwords from .env after bootstrap).
      NEO4J_RUNTIME_USERNAME: "${NEO4J_RUNTIME_USERNAME:-digital_brain_runtime}"
      NEO4J_RUNTIME_PASSWORD: "${NEO4J_RUNTIME_PASSWORD:-}"
      # Typed quality transactions (separate credential). Not an operator key.
      NEO4J_QUALITY_USERNAME: "${NEO4J_QUALITY_USERNAME:-digital_brain_quality}"
      NEO4J_QUALITY_PASSWORD: "${NEO4J_QUALITY_PASSWORD:-}"
      # Coordinator control API secret (local non-MCP). Absent from analyzer envs.
      DIGITAL_BRAIN_COORDINATOR_SECRET: "${DIGITAL_BRAIN_COORDINATOR_SECRET:-}"
      # Intentionally NOT mounted: NEO4J_ADMIN_*, NEO4J_OPERATOR_*,
      # DIGITAL_BRAIN_OPERATOR_SECRET (activation/operator boundary).
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      NEO4J_TRANSPORT: "streamable-http"
      NEO4J_MCP_SERVER_HOST: "0.0.0.0"
      NEO4J_MCP_SERVER_PORT: "8000"
      NEO4J_MCP_SERVER_PATH: "/api/mcp/"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-ollama}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-bge-m3}"
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:-1024}"
      OLLAMA_EMBEDDING_TIMEOUT_SECONDS: "${OLLAMA_EMBEDDING_TIMEOUT_SECONDS:-20}"
      # Always the compose service name inside the network. Host .env may use
      # localhost for host-side tools; that must not leak into this container.
      OLLAMA_BASE_URL: "http://ollama:11434"
      HF_HOME: "/models/huggingface"
      # Shared host↔MCP state for the well-known active harness pin (id only).
      # SessionStart / pin script writes active/harness_generation.{id,json};
      # MCP instrumentation reads it when DIGITAL_BRAIN_HARNESS_GENERATION_ID
      # is not injected into the container env.
      # Host default matches resolve_state_dir / XDG rules (compose-up exports
      # DIGITAL_BRAIN_STATE_DIR before `up` so this mount tracks the pin path).
      DIGITAL_BRAIN_STATE_DIR: "/var/lib/digital-brain"
      # Last-writer active/ when container has no DIGITAL_BRAIN_SESSION_ID.
      # Host brain processes must NOT set this — they fail closed without a session.
      DIGITAL_BRAIN_ALLOW_UNSCOPED_ACTIVE_PIN: "1"
    volumes:
      - hf-cache:/models/huggingface
      # Bind host state dir so dual-process RunEvent emit can resolve the pin.
      # Default: $DIGITAL_BRAIN_STATE_DIR or $XDG_STATE_HOME/digital-brain or
      # ~/.local/state/digital-brain (same as digital_brain.maintenance.resolve_state_dir).
      - "${DIGITAL_BRAIN_STATE_DIR:-${XDG_STATE_HOME:-${HOME}/.local/state}/digital-brain}:/var/lib/digital-brain"
    # /readyz verifies both Neo4j and a real bge-m3 embedding (1024 dims), so
    # a healthy container is safe for JournalEntry writes rather than merely
    # accepting TCP connections.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=25).getcode() == 200 else 1)"]
      interval: 15s
      timeout: 30s
      retries: 4
      start_period: 15s

  mcp-memory:
    profiles: ["memory"]
    build:
      context: ./mcp-neo4j/servers/mcp-neo4j-memory
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MCP_MEMORY_PORT:-8001}:8000"
    environment:
      NEO4J_URL: "bolt://neo4j:7687"
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-password}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      NEO4J_TRANSPORT: "streamable-http"
      NEO4J_MCP_SERVER_HOST: "0.0.0.0"
      NEO4J_MCP_SERVER_PORT: "8000"
      NEO4J_MCP_SERVER_PATH: "/api/mcp/"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    # This only proves that the Ollama API is accepting requests. The
    # mcp-cypher /readyz check below verifies the configured bge-m3 model.
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  neo4j-data:
  neo4j-logs:
  hf-cache:
  ollama-data:
