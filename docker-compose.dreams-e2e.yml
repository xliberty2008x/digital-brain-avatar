# Opt-in, disposable Dreams quality-role E2E stack.
# No host ports. Run only through scripts/run-dreams-e2e.sh with
# DREAMS_E2E_DOCKER=1. In-process dream workflow/crash gates do not need this
# file; they always run via pytest with fake stores.
services:
  dreams-e2e-neo4j:
    image: neo4j:2026.05-enterprise
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: "neo4j/dreams-e2e-password"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      NEO4J_server_memory_heap_initial__size: "256M"
      NEO4J_server_memory_heap_max__size: "512M"
      NEO4J_server_memory_pagecache_size: "256M"
    volumes:
      - dreams-e2e-neo4j-data:/data
      - dreams-e2e-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p dreams-e2e-password 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  dreams-e2e:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
      args:
        E2E_PROFILE: dreams
    depends_on:
      dreams-e2e-neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: "bolt://dreams-e2e-neo4j:7687"
      NEO4J_URL: "bolt://dreams-e2e-neo4j:7687"
      NEO4J_USERNAME: "neo4j"
      NEO4J_PASSWORD: "dreams-e2e-password"
      NEO4J_DATABASE: "neo4j"
      # Role smoke uses neo4j superuser as quality; runtime role is created by
      # init_quality_roles when credentials are available.
      NEO4J_RUNTIME_USERNAME: "neo4j"
      NEO4J_RUNTIME_PASSWORD: "dreams-e2e-password"
      NEO4J_QUALITY_USERNAME: "neo4j"
      NEO4J_QUALITY_PASSWORD: "dreams-e2e-password"
      DIGITAL_BRAIN_REQUIRE_ROLE_SMOKE: "0"
    command:
      - /bin/sh
      - -ec
      - |
        python scripts/init_quality_roles.py || true
        python tests/e2e/quality_control_smoke.py
        python -m pytest tests/e2e/dream_workflow_smoke.py tests/e2e/dream_crash_recovery.py -q --tb=short

volumes:
  dreams-e2e-neo4j-data:
  dreams-e2e-neo4j-logs:
